name: Discord Notifications

on:
  push:
    branches:
      - develop

  pull_request:
    branches:
      - develop
    types:
      - opened
      - closed
      - reopened

jobs:
  notify-discord:
    runs-on: ubuntu-latest

    steps:
      - name: Notification Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          ACTOR: ${{ github.actor }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          EVENT_NAME: ${{ github.event_name }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "::warning::DISCORD_WEBHOOK is not configured."
            exit 0
          fi

          # printf: le contenu des variables n'est jamais interprete comme delimiteur ni format.
          if [ "$EVENT_NAME" = "push" ]; then
            MESSAGE=$(printf '🚀 **Nouveau push sur develop !**\n\n👤 Auteur: %s\n📁 Repository: %s\n💬 Commit: %s\n🔗 %s' \
              "$ACTOR" "$GITHUB_REPOSITORY" "$COMMIT_MSG" "$COMMIT_URL")
          elif [ "$PR_MERGED" = "true" ]; then
            MESSAGE=$(printf '✅ **Pull Request fusionnée dans develop !**\n\n📌 Titre: %s\n👤 Auteur: %s\n🔗 %s' \
              "$PR_TITLE" "$ACTOR" "$PR_URL")
          else
            MESSAGE=$(printf '🔀 **Pull Request**\n\n📌 Titre: %s\n👤 Auteur: %s\n🔗 %s' \
              "$PR_TITLE" "$ACTOR" "$PR_URL")
          fi

          curl --fail --silent --show-error \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg content "$MESSAGE" '{content: $content}')" \
            "$DISCORD_WEBHOOK"
